services:
  backend:
    build: ./backend
    container_name: qa-testcase-backend
    ports:
      - "8000:8000"
    environment:
      - AZURE_DEVOPS_ORG=${AZURE_DEVOPS_ORG}
      - AZURE_DEVOPS_PROJECT=${AZURE_DEVOPS_PROJECT}
      - AZURE_DEVOPS_PAT=${AZURE_DEVOPS_PAT}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.2}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-8192}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.7-flash}
      - GEMINI_FALLBACK_MODELS=${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash,gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.2}
      - GEMINI_MAX_TOKENS=${GEMINI_MAX_TOKENS:-16384}
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    build:
      context: ./backend
      dockerfile: Dockerfile.ollama
    container_name: qa-testcase-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      - OLLAMA_HF_MODEL=${OLLAMA_HF_MODEL:-Qwen/Qwen2.5-7B-Instruct-GGUF:q3_K_M}
      - OLLAMA_DOWNLOAD_SOURCE=${OLLAMA_DOWNLOAD_SOURCE:-auto}
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data: